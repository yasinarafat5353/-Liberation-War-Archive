<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Liberation War Archive</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="./js/script.js"></script>
</head>
<body class="bg-gray-50">
 <!-- Navigation -->
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="font-bold text-xl text-green-700">Liberation War Archive</a>
      <nav class="hidden md:flex gap-6">
        <a href="index.html" class="hover:text-green-700">Home</a>
        <a href="documents.html" class="hover:text-green-700">Documents</a>
        <a href="interviews.html" class="hover:text-green-700">Interviews</a>
        <a href="gallery.html" class="hover:text-green-700">Gallery</a>
        <a href="contact.html" class="hover:text-green-700">Contact</a>
      </nav>
      <button id="menuBtn" class="md:hidden p-2 border rounded">☰</button>
    </div>
    <div id="mobileMenu" class="hidden bg-white border-t flex flex-col md:hidden">
      <a href="index.html" class="px-4 py-2 hover:bg-green-50">Home</a>
      <a href="documents.html" class="px-4 py-2 hover:bg-green-50">Documents</a>
      <a href="interviews.html" class="px-4 py-2 hover:bg-green-50">Interviews</a>
      <a href="gallery.html" class="px-4 py-2 hover:bg-green-50">Gallery</a>
      <a href="contact.html" class="px-4 py-2 hover:bg-green-50">Contact</a>
    </div>
  </header>
<main class="container mx-auto px-4 py-10">
<h1 class="text-3xl font-semibold mb-6 text-center">Contact & Contribute</h1>
<p class="text-gray-600 mb-6 text-center">Send us your queries or share your documents/photos.</p>
  <!-- Contact Form Section -->
  <section class="py-16">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow p-8">
      <form id="contactForm" class="space-y-6">
        
        <!-- Name -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Name</label>
          <input type="text" id="name" placeholder="Enter your name"
                 class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
          <input type="email" id="email" placeholder="Enter your email"
                 class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
        </div>

        <!-- Subject -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Subject</label>
          <input type="text" id="subject" placeholder="Enter subject"
                 class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
        </div>

        <!-- Message -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Message</label>
          <textarea id="message" rows="4" placeholder="Write your message..."
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
        </div>

        <!-- File Upload -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Attach Image (optional)</label>
          <input type="file" id="fileUpload" class="w-full border rounded-lg px-3 py-2">
        </div>

        <!-- Submit Button -->
        <button type="submit"
                class="w-full bg-green-700 text-white py-3 rounded-lg font-semibold hover:bg-green-800 transition">
          Send Message
        </button>

        <!-- Success Message -->
        <p id="successMessage" class="hidden text-green-700 font-semibold mt-3 text-center">
          ✅ Your message has been sent successfully!
        </p>
      </form>
    </div>
  </section>

</main>
 <footer class="bg-white border-t py-6 text-center text-sm text-gray-600">
    © 2025 Liberation War Archive. All rights reserved.
  </footer>

</body>
</html>
